name: Bug
description: PolCV does something it should not.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real CV, profile, API key or log containing them here.** This issue is
        public. If another page or machine can read the profile or run a command, or personal data
        reached the model while masking was on, report it privately from the Security tab instead.

        A personal value that masking did not recognise belongs to the library that does the
        masking: report it at [polanon](https://github.com/boromat/polanon/issues).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: >-
        With an invented person and a made-up posting only: names you made up, addresses at
        example.com.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and system
      description: The version at the bottom of Settings or in package.json, and how you started it.
      placeholder: 1.3.1, Windows 11, start.bat, Node.js 24
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and masking
      description: If the problem is in what the AI wrote or saw.
      placeholder: anthropic/claude-haiku-5.5, masking on with polanon 0.4.0
